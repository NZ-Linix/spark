name: CI

# Linux is the gate for every change. Behavior that can differ on macOS runs in
# .github/workflows/macos.yml only when a change needs it.

on:
  workflow_dispatch:
    inputs:
      acp_live:
        description: Also run the full ACP suite with live model calls
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

concurrency:
  # A manual dispatch gets its own group so it cannot cancel the push run on
  # main. A push to main runs the durable-session model check, which takes
  # about 40 minutes, so a newer push waits instead of cancelling it. Without
  # this, merges land faster than a run can finish and main never reports a
  # result. GitHub keeps only the newest waiting run.
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'dispatch-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zig_mode:
    name: Build & Test (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - optimize: ReleaseSafe
            test_timeout_seconds: 1500
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        id: zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.1"
          cache-key: ci-unit-${{ matrix.optimize }}

      - name: Check formatting
        run: zig fmt --check src/

      - name: Validate PGSO corpus classification
        run: |
          python3 -m scripts.pgso.corpus --manifest scripts/pgso/corpus.json --list
          python3 -m unittest scripts.pgso.tests.test_corpus

      - name: Audit public surface
        run: ./scripts/check-public-surface.sh

      - name: Check compactor boundary
        run: ./scripts/check-compactor-boundary.sh

      - name: Check indexer boundary
        run: ./scripts/check-indexer-boundary.sh

      - name: Check agents boundary
        run: ./scripts/check-agents-boundary.sh

      - name: Check recovery boundary
        run: ./scripts/check-recovery-boundary.sh

      - name: Model-check request recovery
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          TLA2TOOLS_JAR="$jar" tests/tla/recovery/check.sh

      - name: Model-check the empty-reply nudge
        run: TLA2TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" tests/tla/agent_runtime/check.sh

      - name: Model-check the connection open hand-off
        run: TLA2TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" tests/tla/gateway_open/check.sh

      - name: Model-check session titles and the model list under a shared sign-in
        run: TLA2TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" tests/tla/session_title/check.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Walk the recovery module along its model
        run: TLA2TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" bun tests/tla/drivers/recovery/driver.ts --self-check

      - name: Walk the connection open hand-off along its model
        run: TLA2TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" bun tests/tla/drivers/gateway_open/driver.ts --self-check

      - name: Check CLI shape
        run: python3 -m scripts.check_cli_shape

      - name: Test CI and release scripts
        run: python3 -m unittest scripts.tests.test_macos_signing scripts.tests.test_signed_macos scripts.tests.test_detect_macos_need scripts.tests.test_detect_ci_need scripts.tests.test_fuzz_nightly scripts.tests.test_check_cli_shape

      - name: Test the zig skill's scripts and examples
        run: python3 -m unittest discover -s .spark/skills/zig/scripts

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Walk spark ask turns along the empty-reply model
        run: TLA2TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" bun tests/tla/drivers/agent_runtime/driver.ts --self-check

      - name: Walk spark ask turns along the malformed tool call model
        run: TLA2TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" bun tests/tla/drivers/agent_runtime/malformed.ts --self-check

      # The zsh user profile tests in src/core/execution/command_runner.zig
      # skip without /bin/zsh. They start interactive zsh with no terminal,
      # where Ubuntu's global zshrc runs compinit, and on this runner compinit
      # aborts and writes an error to stderr, so the job turns it off. The
      # shell parity tests in src/core/shell_command/command_effect.zig use
      # zsh too.
      - name: Install zsh
        run: |
          command -v zsh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh; }
          echo 'skip_global_compinit=1' | sudo tee -a /etc/zsh/zshenv >/dev/null

      - name: Test
        env:
          TEST_TIMEOUT_SECONDS: ${{ matrix.test_timeout_seconds }}
          # Ubuntu has sh, dash, and bash, and the step above adds zsh, so the
          # shell parity tests fail here if any of them is missing.
          SPARK_TEST_SHELL_PARITY_ALL_SHELLS: "1"
        run: |
          started_at=$SECONDS
          trap 'printf "Unit tests elapsed: %ss\n" "$((SECONDS - started_at))"' EXIT
          timeout "${TEST_TIMEOUT_SECONDS}s" zig build test -Doptimize=${{ matrix.optimize }} --summary all

      - name: Save Zig cache
        uses: ./.github/actions/save-zig-cache
        with:
          cache-key: ${{ steps.zig.outputs.cache-key }}
          cache-hit: ${{ steps.zig.outputs.cache-hit }}

  zig:
    name: Build & Test
    if: ${{ always() }}
    needs: [zig_mode, tla-mcp, tla-mcp-host, tla-transcript-window, tla-subagent]
    runs-on: ubuntu-latest
    steps:
      - name: Require unit tests and every model check
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          printf '%s\n' "$RESULTS"
          jq -e 'length == 5 and all(.[]; . == "success")' <<<"$RESULTS"

  build:
    name: Build spark (ReleaseSafe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        id: zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.1"
          cache-key: ci-build-ReleaseSafe

      # Other runners execute this binary, and their CPUs can differ from this
      # one. A native build can emit instructions such as AVX-512 that those
      # runners lack, so target the baseline CPU like the release builds do.
      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: Smoke test fresh binary
        run: scripts/smoke-binary.sh zig-out/bin/spark

      - name: Share the binary with E2E jobs
        uses: actions/upload-artifact@v4
        with:
          name: spark-linux-x86_64
          path: zig-out/bin/spark
          if-no-files-found: error
          retention-days: 1

      - name: Save Zig cache
        uses: ./.github/actions/save-zig-cache
        with:
          cache-key: ${{ steps.zig.outputs.cache-key }}
          cache-hit: ${{ steps.zig.outputs.cache-hit }}

  # Releases ship a 32-bit x86 Linux build, for old PCs and the iSH app.
  # Zig rejects 64-bit atomics there, so build it on every change and run it
  # on this x86_64 runner, which executes 32-bit static binaries.
  build-x86:
    name: Build spark (Linux x86, 32-bit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        id: zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.1"
          cache-key: ci-build-x86-linux-musl

      # The same target and CPU as the linux-x86 release build.
      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86-linux-musl -Dcpu=i686

      - name: Test i386 file and clock compatibility
        run: zig test src/core/shared/i386_syscall_fallbacks.zig -OReleaseSafe -target x86-linux-musl -mcpu i686 -lc --test-filter 'legacy i386 metadata'

      - name: Check the binary is 32-bit x86
        run: file zig-out/bin/spark | grep -Eq "ELF 32-bit LSB.*Intel 80386.*statically linked"

      - name: Smoke test fresh binary
        run: scripts/smoke-binary.sh zig-out/bin/spark

      - name: Share the binary with the iSH smoke test
        uses: actions/upload-artifact@v4
        with:
          name: spark-linux-x86
          path: zig-out/bin/spark
          retention-days: 1
          if-no-files-found: error

      - name: Save Zig cache
        uses: ./.github/actions/save-zig-cache
        with:
          cache-key: ${{ steps.zig.outputs.cache-key }}
          cache-hit: ${{ steps.zig.outputs.cache-hit }}

  ish-smoke:
    name: Smoke test App Store iSH on macOS
    needs: build-x86
    # iSH translates guest syscalls to the host kernel; the App Store build uses Darwin.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the x86 binary
        uses: actions/download-artifact@v4
        with:
          name: spark-linux-x86
          path: zig-out/bin

      - name: Test streamed chat, session resume, and upgrades
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew install llvm@22 lld@22 meson ninja pkgconf libarchive
          llvm=$(brew --prefix llvm@22)
          lld=$(brew --prefix lld@22)
          archive=$(brew --prefix libarchive)
          export PATH="$llvm/bin:$lld/bin:$PATH"
          export PKG_CONFIG_PATH="$archive/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          dir="$RUNNER_TEMP/ish-test"
          mkdir -p "$dir"
          git clone --depth 1 --branch builds/494 --recurse-submodules https://github.com/ish-app/ish.git "$dir/ish"
          test "$(git -C "$dir/ish" rev-parse HEAD)" = 216cf98a7cda1d68221add374630ede00aae9cd4
          CC=clang meson setup "$dir/ish/build" "$dir/ish" -Dlog=strace
          ninja -C "$dir/ish/build" ish tools/fakefsify
          curl -fsSL --retry 3 https://dl-cdn.alpinelinux.org/alpine/v3.16/releases/x86/alpine-minirootfs-3.16.9-x86.tar.gz -o "$dir/alpine.tar.gz"
          echo "eaec6686160cf426e90874fca12df3b3716777a850d6a7941510f65c687a8579  $dir/alpine.tar.gz" | shasum -a 256 -c
          "$dir/ish/build/tools/fakefsify" "$dir/alpine.tar.gz" "$dir/alpine"
          "$dir/ish/build/ish" -f "$dir/alpine" /bin/sh -c 'mknod -m 666 /dev/null c 1 3'
          python3 scripts/smoke-ish.py zig-out/bin/spark "$dir/ish/build/ish" "$dir/alpine"

  # The two TLA+ MCP jobs take about 20 minutes each, and the TLA+ transcript
  # window and subagent models a few each. A pull request runs each only when
  # it changes the code that check covers; see scripts/detect-ci-need.sh.
  # Pushes to main and manual dispatches always run all of them.
  ci-need:
    name: Detect CI need
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mcp: ${{ steps.detect.outputs.mcp }}
      transcript_window: ${{ steps.detect.outputs.transcript_window }}
      subagent: ${{ steps.detect.outputs.subagent }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Decide which model checks this change needs
        id: detect
        env:
          CI_NEED_REQUESTED: ${{ github.event_name == 'push' && 'push to main' || (github.event_name == 'workflow_dispatch' && 'manual dispatch' || '') }}
        # A pull request's merge commit has the base branch as its first parent.
        run: scripts/detect-ci-need.sh HEAD^1 HEAD

  tla-mcp:
    name: TLA+ MCP engine models and driver
    needs: [build, ci-need]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - name: Download spark
        uses: actions/download-artifact@v4
        with:
          name: spark-linux-x86_64
          path: zig-out/bin
      - name: Restore executable mode
        run: chmod +x zig-out/bin/spark
      # The MCP driver builds its labs against src/mcp/.
      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.1"
          cache-key: ci-tla-mcp
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install tmux
        run: |
          command -v tmux >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y tmux; }
          printf 'set-option -g history-limit 100000\n' > "$HOME/.tmux.conf"
          tmux -V
      - name: Model-check the MCP engine, and drive src/mcp/ along the models
        if: needs.ci-need.outputs.mcp == 'true'
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          export TLA2TOOLS_JAR="$jar"
          python3 tests/tla/mcp/run.py check
          bun tests/tla/drivers/mcp/driver.ts

  # The MCP host models, which models.test.ts checks with TLC, and the drivers
  # that run spark along them. It runs beside the engine job above. Planted bugs
  # stay local (tests/tla/mcp_host/check.sh).
  tla-mcp-host:
    name: TLA+ MCP host models and drivers
    needs: [build, ci-need]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - name: Download spark
        uses: actions/download-artifact@v4
        with:
          name: spark-linux-x86_64
          path: zig-out/bin
      - name: Restore executable mode
        run: chmod +x zig-out/bin/spark
      # The same toolchain as the engine job.
      - name: Setup Zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.1"
          cache-key: ci-tla-mcp-host
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install tmux
        run: |
          command -v tmux >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y tmux; }
          printf 'set-option -g history-limit 100000\n' > "$HOME/.tmux.conf"
          tmux -V
      - name: Model-check the MCP host, and drive spark along the models
        if: needs.ci-need.outputs.mcp == 'true'
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          export TLA2TOOLS_JAR="$jar"
          bun test ./tests/tla/drivers/mcp_host/

  # The transcript window model and the window's core driven along it both
  # ways. Its planted bugs and the run of a built spark along the model stay local
  # (tests/tla/transcript_window/check.sh without --ci): the first measure the
  # checks, not the code, and the second drives spark through tmux.
  tla-transcript-window:
    name: TLA+ transcript window model
    needs: ci-need
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        if: needs.ci-need.outputs.transcript_window == 'true'
      # The core's tests and the drivers' harness build against
      # src/ui/transcript/transcript_window.zig.
      - name: Setup Zig
        if: needs.ci-need.outputs.transcript_window == 'true'
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.1"
          cache-key: ci-tla-transcript-window
      - name: Setup Bun
        if: needs.ci-need.outputs.transcript_window == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Model-check the transcript window and drive its core along the model
        if: needs.ci-need.outputs.transcript_window == 'true'
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          TLA2TOOLS_JAR="$jar" tests/tla/transcript_window/check.sh --ci

  # The subagent steering, stop-then-message, main-mail and wait-nudge models, the
  # session-write and live sessions models, and the drivers that run a built spark
  # along them. Only the design configs and the session witnesses run here; the
  # planted bugs and spark's old defects stay local (both check.sh scripts with no
  # arguments): they measure the checks, not the code.
  tla-subagent:
    name: TLA+ subagent and session-write models
    needs: [build, ci-need]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
        if: needs.ci-need.outputs.subagent == 'true'
      - name: Download spark
        if: needs.ci-need.outputs.subagent == 'true'
        uses: actions/download-artifact@v4
        with:
          name: spark-linux-x86_64
          path: zig-out/bin
      - name: Restore executable mode
        if: needs.ci-need.outputs.subagent == 'true'
        run: chmod +x zig-out/bin/spark
      - name: Setup Bun
        if: needs.ci-need.outputs.subagent == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Model-check subagent messages, session writes, and live sessions, and drive spark along the models
        if: needs.ci-need.outputs.subagent == 'true'
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          curl -fsSL -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          export TLA2TOOLS_JAR="$jar"
          tests/tla/subagent/check.sh steer-queue steer-queue-deep stop-message stop-message-deep main-mail main-mail-acp quiet-relay quiet-relay-deep wait-nudge
          tests/tla/session/check.sh session-write session-write-witness-added-during-write session-write-witness-waits session-write-witness-relisted live-holds live-simulate live-witness-stale live-witness-idle-parent live-witness-open-fails-on-scan
          bun tests/tla/drivers/subagent/driver.ts
          bun test ./tests/tla/drivers/subagent/stop-message.test.ts
          bun test ./tests/tla/drivers/subagent/main-mail.test.ts
          bun test ./tests/tla/drivers/subagent/quiet-relay.test.ts
          bun test ./tests/tla/drivers/session/write.test.ts
          bun test ./tests/tla/drivers/session/live.test.ts

  e2e_mode:
    name: E2E (deterministic, shard ${{ matrix.shard.label }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - index: 0
            label: "1/4"
          - index: 1
            label: "2/4"
          - index: 2
            label: "3/4"
          - index: 3
            label: "4/4"
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
      SPARK_REQUIRE_TMUX: "1"
      SHARD_INDEX: ${{ matrix.shard.index }}
      SHARD_COUNT: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download spark
        uses: actions/download-artifact@v4
        with:
          name: spark-linux-x86_64
          path: zig-out/bin

      - name: Restore executable mode
        run: chmod +x zig-out/bin/spark

      # Some E2E files build their own Zig fixtures.
      - name: Setup Zig
        id: zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.1"
          cache-key: ci-e2e-fixtures

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install E2E system dependencies
        timeout-minutes: 17
        run: |
          missing=()
          command -v tmux >/dev/null 2>&1 || missing+=(tmux)
          command -v zsh >/dev/null 2>&1 || missing+=(zsh)
          # cli.test.ts runs the fish completion script only where fish is installed.
          command -v fish >/dev/null 2>&1 || missing+=(fish)
          if [ "${#missing[@]}" -gt 0 ]; then
            retry() {
              local attempt
              for attempt in 1 2; do
                if "$@"; then
                  return 0
                fi
                if [ "$attempt" -lt 2 ]; then
                  printf 'Dependency install attempt %s failed; retrying in 5s\n' "$attempt" >&2
                  sleep 5
                fi
              done
              return 1
            }
            # The Azure mirror can stall after APT has already fetched release
            # metadata from the direct Ubuntu fallback. Prefer that fallback
            # for the whole update when the runner's mirror list provides it.
            if [ -f /etc/apt/apt-mirrors.txt ] &&
              grep -Eq '^https?://(archive|ports)\.ubuntu\.com/' /etc/apt/apt-mirrors.txt
            then
              sudo sed -i '/:\/\/azure\..*ubuntu\.com\//d' /etc/apt/apt-mirrors.txt
            fi
            retry sudo timeout --kill-after=15s 4m apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update
            retry sudo timeout --kill-after=15s 3m apt-get \
              -o Dpkg::Use-Pty=0 \
              install -y "${missing[@]}"
          fi
          printf 'set-option -g history-limit 100000\n' > "$HOME/.tmux.conf"
          tmux -V
          zsh --version
          fish --version

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile
        working-directory: tests/e2e

      - name: Run deterministic E2E shard
        working-directory: tests/e2e
        run: |
          selected=()
          selection_file="$RUNNER_TEMP/spark-e2e-shard-${SHARD_INDEX}.txt"
          bun ci-shards.ts \
            --shard-count "$SHARD_COUNT" \
            --shard-index "$SHARD_INDEX" > "$selection_file"
          while IFS= read -r test_file; do
            selected+=("$test_file")
          done < "$selection_file"

          test "${#selected[@]}" -gt 0
          printf 'Running E2E shard %s/%s (%s files):\n' "$((SHARD_INDEX + 1))" "$SHARD_COUNT" "${#selected[@]}"
          printf '  %s\n' "${selected[@]}"
          ./ci-run-files.sh "${selected[@]}"

      - name: Save Zig cache
        if: matrix.shard.index == 0
        uses: ./.github/actions/save-zig-cache
        with:
          cache-key: ${{ steps.zig.outputs.cache-key }}
          cache-hit: ${{ steps.zig.outputs.cache-hit }}

  e2e_conformance:
    name: E2E (MCP conformance)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
      SPARK_SOUND: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Download spark
        uses: actions/download-artifact@v4
        with:
          name: spark-linux-x86_64
          path: zig-out/bin

      - name: Restore executable mode
        run: chmod +x zig-out/bin/spark

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile
        working-directory: tests/e2e

      - name: Install isolated MCP conformance package
        run: npm ci
        working-directory: tests/e2e/conformance

      - name: Run isolated MCP conformance baseline
        run: npm test
        working-directory: tests/e2e/conformance

      - name: Save Zig cache
        uses: ./.github/actions/save-zig-cache
        with:
          cache-key: ${{ steps.zig.outputs.cache-key }}
          cache-hit: ${{ steps.zig.outputs.cache-hit }}

  e2e:
    name: E2E (deterministic)
    if: ${{ always() }}
    needs: [e2e_mode, e2e_conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard and the conformance baseline
        env:
          SHARD_RESULT: ${{ needs.e2e_mode.result }}
          CONFORMANCE_RESULT: ${{ needs.e2e_conformance.result }}
        run: |
          test "$SHARD_RESULT" = success
          test "$CONFORMANCE_RESULT" = success

  lint-scripts:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck Spark scripts
        run: |
          scripts=(
            benchmarks/startup.sh
            scripts/check-agents-boundary.sh
            scripts/check-compactor-boundary.sh
            scripts/check-indexer-boundary.sh
            scripts/check-public-surface.sh
            scripts/check-recovery-boundary.sh
            scripts/detect-ci-need.sh
            scripts/detect-macos-need.sh
            scripts/smoke-binary.sh
            tests/e2e/ci-run-files.sh
          )
          # bash -n parses only its first argument, so check each script.
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck "${scripts[@]}"

  e2e_acp_live:
    name: E2E ACP (live models)
    if: github.event_name == 'workflow_dispatch' && inputs.acp_live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        id: zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.17.1"
          cache-key: ci-unit-ReleaseSafe

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install e2e deps
        run: bun install
        working-directory: tests/e2e

      - name: Run full ACP tests
        run: bun test acp.test.ts
        working-directory: tests/e2e
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
