name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build all platforms and compare arm64 signing pages without publishing
        type: boolean
        default: false
      prerelease_tag:
        description: Publish a test prerelease with a suffix, such as v26.11.20-rc3
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ inputs.prerelease_tag && format('spark-prerelease-{0}', inputs.prerelease_tag) || 'stable-release' }}
  cancel-in-progress: false

jobs:
  check-version:
    if: github.ref == 'refs/heads/main' && !inputs.prerelease_tag
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check if release needed
        id: check
        env:
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only }}
        run: |
          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is a dev version; nothing to release"
            exit 0
          fi
          TAG="v${VERSION}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$VALIDATE_ONLY" == true ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Validating release artifacts without publishing"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} exists, no release needed"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} missing, release needed"
          fi

  build-linux-aarch64:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/pgso-linux-arm64.yml
    with:
      # Keep release evidence long enough to serve as the main control for
      # manual PGSO comparisons.
      evidence-retention-days: 90

  build-linux-x86_64:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/pgso-linux-x86_64.yml
    with:
      evidence-retention-days: 90

  package-linux:
    needs: [check-version, build-linux-aarch64, build-linux-x86_64]
    if: needs.check-version.outputs.needed == 'true'
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
            artifact-id: ${{ needs.build-linux-aarch64.outputs.artifact-id }}
          - name: linux-x86_64
            runner: ubuntu-24.04
            arch: x86_64
            artifact-id: ${{ needs.build-linux-x86_64.outputs.artifact-id }}
    env:
      ARCH: ${{ matrix.arch }}
      ARCHIVE: spark-${{ matrix.name }}.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require native host
        run: test "$(uname -m)" = "$ARCH"

      - name: Download eligible candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ matrix.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/spark-pgso

      - name: Restore executable mode
        run: chmod +x "$RUNNER_TEMP/spark-pgso/candidate/spark"

      - name: Confirm release eligibility
        run: python3 -m scripts.pgso report --output-dir "$RUNNER_TEMP/spark-pgso" >/dev/null

      - name: Confirm the candidate is the qualified binary
        run: |
          python3 - "$RUNNER_TEMP/spark-pgso" <<'EOF'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = manifest["evidence"]["artifacts"]["candidate"]["sha256"]
          actual = hashlib.sha256((root / "candidate/spark").read_bytes()).hexdigest()
          if actual != expected:
              sys.exit(f"candidate SHA-256 {actual} is not the qualified {expected}")
          EOF

      - name: Smoke-test the candidate
        run: |
          "$RUNNER_TEMP/spark-pgso/candidate/spark" --version
          "$RUNNER_TEMP/spark-pgso/candidate/spark" help >/dev/null

      - name: Smoke test the signed arm64 candidate
        run: |
          binary="$RUNNER_TEMP/spark-pgso-aggregate/candidate/spark"
          codesign --verify --strict --check-notarization -R=notarized "$binary"
          "$binary" --version
          "$binary" help >/dev/null

      - name: Package stable release candidate
        run: |
          python3 -c 'import pathlib, sys; n = pathlib.Path(sys.argv[1]).stat().st_size; print(f"linux PGSO executable: {n:,} bytes ({n / 1048576:.6f} MiB)")' "$RUNNER_TEMP/spark-pgso/candidate/spark" >> "$GITHUB_STEP_SUMMARY"
          package_dir="$RUNNER_TEMP/spark-release-package"
          mkdir -p "$package_dir"
          cp "$RUNNER_TEMP/spark-pgso/candidate/spark" LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf "$RUNNER_TEMP/$ARCHIVE" -C "$package_dir" spark LICENSE THIRD_PARTY_NOTICES.md
          cd "$RUNNER_TEMP"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload stable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spark-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/${{ env.ARCHIVE }}
            ${{ runner.temp }}/${{ env.ARCHIVE }}.sha256
          if-no-files-found: error

  build-macos-x86_64:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build macos-x86_64
    runs-on: macos-15-intel
    environment: apple-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.1"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos

      - name: Sign and notarize
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/sign-and-notarize-macos.sh zig-out/bin/spark

      - name: Verify notarized Intel binary
        run: |
          codesign --verify --strict --check-notarization -R=notarized ./zig-out/bin/spark
          ./zig-out/bin/spark --version
          ./zig-out/bin/spark help

      - name: Package
        run: |
          python3 -c 'import pathlib; n = pathlib.Path("zig-out/bin/spark").stat().st_size; print(f"macOS Intel signed executable: {n:,} bytes ({n / 1048576:.6f} MiB)")' >> "$GITHUB_STEP_SUMMARY"
          package_dir="$RUNNER_TEMP/spark-package-macos-x86_64"
          mkdir -p "$package_dir"
          cp zig-out/bin/spark LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf spark-macos-x86_64.tar.gz -C "$package_dir" spark LICENSE THIRD_PARTY_NOTICES.md
          shasum -a 256 spark-macos-x86_64.tar.gz > spark-macos-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spark-macos-x86_64
          path: |
            spark-macos-x86_64.tar.gz
            spark-macos-x86_64.tar.gz.sha256

  build-macos-arm64:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/pgso-macos-arm64.yml
    with:
      # Keep release evidence long enough to serve as the main control for
      # manual PGSO comparisons.
      evidence-retention-days: 90

  sign-macos-arm64:
    needs: [check-version, build-macos-arm64]
    if: needs.check-version.outputs.needed == 'true'
    name: Sign macos-arm64
    runs-on: macos-15
    environment: apple-signing
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require native arm64 host
        run: test "$(uname -m)" = arm64

      - name: Download eligible candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build-macos-arm64.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/spark-pgso-aggregate

      - name: Restore executable mode
        run: chmod +x "$RUNNER_TEMP/spark-pgso-aggregate/candidate/spark"

      - name: Confirm release eligibility
        run: python3 -m scripts.pgso report --output-dir "$RUNNER_TEMP/spark-pgso-aggregate" >/dev/null

      - name: Sign and notarize stable release candidate
        env:
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ "$VALIDATE_ONLY" == true ]]; then
            control_dir="$RUNNER_TEMP/spark-signing-control"
            mkdir -p "$control_dir"
            cp "$RUNNER_TEMP/spark-pgso-aggregate/candidate/spark" "$control_dir/spark"
            scripts/sign-and-notarize-macos.sh "$control_dir/spark" 4096
            scripts/sign-and-notarize-macos.sh "$RUNNER_TEMP/spark-pgso-aggregate/candidate/spark" 16384
          else
            scripts/sign-and-notarize-macos.sh "$RUNNER_TEMP/spark-pgso-aggregate/candidate/spark"
          fi

      - name: Verify notarized arm64 binaries
        if: github.event_name == 'workflow_dispatch' && inputs.validate_only
        run: |
          for binary in "$RUNNER_TEMP/spark-signing-control/spark" "$RUNNER_TEMP/spark-pgso-aggregate/candidate/spark"; do
            codesign --verify --strict --check-notarization -R=notarized "$binary"
            "$binary" --version
            "$binary" help
            python3 -c 'import pathlib, sys; n = pathlib.Path(sys.argv[1]).stat().st_size; print(f"{sys.argv[1]}: {n:,} bytes ({n / 1048576:.6f} MiB)")' "$binary" >> "$GITHUB_STEP_SUMMARY"
            shasum -a 256 "$binary" >> "$GITHUB_STEP_SUMMARY"
          done
          tar -czf "$RUNNER_TEMP/spark-signing-control.tar.gz" -C "$RUNNER_TEMP/spark-signing-control" spark

      - name: Upload arm64 signing control
        if: github.event_name == 'workflow_dispatch' && inputs.validate_only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-control-macos-arm64
          path: ${{ runner.temp }}/spark-signing-control.tar.gz
          if-no-files-found: error

      - name: Package stable release candidate
        run: |
          archive="$RUNNER_TEMP/spark-macos-aarch64.tar.gz"
          package_dir="$RUNNER_TEMP/spark-release-package"
          mkdir -p "$package_dir"
          cp "$RUNNER_TEMP/spark-pgso-aggregate/candidate/spark" LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf "$archive" -C "$package_dir" spark LICENSE THIRD_PARTY_NOTICES.md
          cd "$RUNNER_TEMP"
          shasum -a 256 spark-macos-aarch64.tar.gz > spark-macos-aarch64.tar.gz.sha256

      - name: Upload stable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spark-macos-aarch64
          path: |
            ${{ runner.temp }}/spark-macos-aarch64.tar.gz
            ${{ runner.temp }}/spark-macos-aarch64.tar.gz.sha256
          if-no-files-found: error

  build-linux-x86:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build and test Linux i686
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.1"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86-linux-musl -Dcpu=i686

      - name: Smoke test the i686 build
        run: |
          file zig-out/bin/spark | grep -Eq "ELF 32-bit LSB.*Intel 80386.*statically linked"
          ./zig-out/bin/spark --version
          ./zig-out/bin/spark help >/dev/null

      - name: Package
        run: |
          set -euo pipefail
          archive="spark-linux-x86.tar.gz"
          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$package_dir"
          cp zig-out/bin/spark LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf "$archive" -C "$package_dir" spark LICENSE THIRD_PARTY_NOTICES.md
          sha256sum "$archive" > "$archive.sha256"
          ls -l "$archive"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spark-linux-x86
          path: |
            spark-linux-x86.tar.gz
            spark-linux-x86.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [check-version, package-linux, build-macos-x86_64, sign-macos-arm64, build-linux-x86]
    if: needs.check-version.outputs.publish == 'true'
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: spark-*
          path: dist
          merge-multiple: true

      - name: Write latest.txt and the release notes
        env:
          TAG: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAG" > dist/latest.txt
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > notes.md
          if [ "$(grep -c . notes.md)" -lt 1 ]; then
            printf 'spark %s\n' "$TAG" > notes.md
          fi
          cat >> notes.md <<EOF

          ### Install

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh
          \`\`\`

          Already installed? Run \`spark update\`, or \`/update\` inside spark.
          EOF
          ls -l dist

      - name: Verify and publish all release archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          for target in linux-x86 linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64; do
            (cd dist && sha256sum -c "spark-$target.tar.gz.sha256")
          done
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "spark $TAG" \
            --notes-file notes.md \
            --latest \
            dist/spark-*.tar.gz dist/spark-*.tar.gz.sha256 dist/latest.txt

  check-prerelease:
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease_tag && !inputs.validate_only
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check whether this version needs a release
        id: check
        env:
          PRERELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease_tag || '' }}
        run: |
          if [ -n "$PRERELEASE_TAG" ]; then
            # A suffix is required, so a pre-release can never take a stable tag.
            if ! [[ "$PRERELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-[0-9A-Za-z.]+$ ]]; then
              echo "::error::$PRERELEASE_TAG is not a pre-release tag such as v26.11.20-rc1"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$PRERELEASE_TAG" >/dev/null; then
              echo "::error::$PRERELEASE_TAG already exists"
              exit 1
            fi
            {
              echo "tag=$PRERELEASE_TAG"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing pre-release $PRERELEASE_TAG from $GITHUB_REF_NAME"
            exit 0
          fi

  build-prerelease:
    needs: check-prerelease
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux-gnu.2.34
            cpu: baseline
          - name: linux-aarch64
            target: aarch64-linux-gnu.2.34
            cpu: baseline
          # 32-bit x86 runs on old PCs and in the iSH app on iPhone and iPad,
          # which runs Alpine (musl, no glibc) on an emulated i686 without
          # SSE. A static musl build for the plain i686 CPU runs on both.
          - name: linux-x86
            target: x86-linux-musl
            cpu: i686
          - name: macos-x86_64
            target: x86_64-macos
            cpu: baseline
          - name: macos-aarch64
            target: aarch64-macos
            cpu: baseline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.1"

      - name: Build
        env:
          SPARK_BUILD_TARGET: ${{ matrix.target }}
          SPARK_BUILD_CPU: ${{ matrix.cpu }}
        run: zig build -Doptimize=ReleaseSafe -Dtarget="$SPARK_BUILD_TARGET" -Dcpu="$SPARK_BUILD_CPU"

      - name: Package
        run: |
          set -euo pipefail
          archive="spark-${{ matrix.name }}.tar.gz"
          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$package_dir"
          cp zig-out/bin/spark LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf "$archive" -C "$package_dir" spark LICENSE THIRD_PARTY_NOTICES.md
          sha256sum "$archive" > "$archive.sha256"
          ls -l "$archive"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spark-${{ matrix.name }}
          path: |
            spark-${{ matrix.name }}.tar.gz
            spark-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  smoke-prerelease:
    needs: build-prerelease
    name: Run ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          # An x86_64 Linux kernel runs 32-bit static binaries.
          - name: linux-x86
            runner: ubuntu-latest
          - name: macos-x86_64
            runner: macos-15-intel
          - name: macos-aarch64
            runner: macos-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spark-${{ matrix.name }}

      - name: Check the checksum and run the binary
        run: |
          set -euo pipefail
          archive="spark-${{ matrix.name }}.tar.gz"
          if command -v sha256sum >/dev/null; then sha256sum -c "$archive.sha256"; else shasum -a 256 -c "$archive.sha256"; fi
          tar -xzf "$archive"
          ./spark --version
          ./spark help >/dev/null

  publish-prerelease:
    needs: [check-prerelease, build-prerelease, smoke-prerelease]
    environment: prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Write the pre-release notes
        env:
          TAG: ${{ needs.check-prerelease.outputs.tag }}
        run: |
          set -euo pipefail
          installer="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh"
          cat > notes.md <<EOF
          Test pre-release built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}. It is not the latest release, and \`spark update\` never installs it.

          ### Install

          \`\`\`sh
          curl -fsSL ${installer} | sh -s -- --version ${TAG}
          \`\`\`

          Without curl, as on Alpine and in the iSH app:

          \`\`\`sh
          wget -qO- ${installer} | sh -s -- --version ${TAG}
          \`\`\`
          EOF
          ls -l dist

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-prerelease.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "spark $TAG" \
            --notes-file notes.md \
            --prerelease \
            --latest=false \
            dist/spark-*.tar.gz dist/spark-*.tar.gz.sha256
