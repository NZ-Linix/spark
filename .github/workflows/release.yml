name: Release

# Publishes a GitHub release when src/main.zig carries a stable version
# (X.Y.Z, no suffix) that has no tag yet. A dev version such as 26.11.19-d
# never releases.
#
# Every release carries what install.sh and `spark update` read:
#   latest.txt                      the release's tag, such as v26.11.19
#   spark-<os>-<arch>.tar.gz        spark, LICENSE, THIRD_PARTY_NOTICES.md
#   spark-<os>-<arch>.tar.gz.sha256 its checksum

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

env:
  ZIG_VERSION: "0.17.1"

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check whether this version needs a release
        id: check
        run: |
          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is a dev version; nothing to release"
            exit 0
          fi
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already released"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $TAG"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux-gnu.2.34
            cpu: baseline
          - name: linux-aarch64
            target: aarch64-linux-gnu.2.34
            cpu: baseline
          # 32-bit x86 runs on old PCs and in the iSH app on iPhone and iPad,
          # which runs Alpine (musl, no glibc) on an emulated i686 without
          # SSE. A static musl build for the plain i686 CPU runs on both.
          - name: linux-x86
            target: x86-linux-musl
            cpu: i686
          - name: macos-x86_64
            target: x86_64-macos
            cpu: baseline
          - name: macos-aarch64
            target: aarch64-macos
            cpu: baseline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -Dcpu=${{ matrix.cpu }}

      - name: Package
        run: |
          set -euo pipefail
          archive="spark-${{ matrix.name }}.tar.gz"
          package_dir="$RUNNER_TEMP/package"
          mkdir -p "$package_dir"
          cp zig-out/bin/spark LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf "$archive" -C "$package_dir" spark LICENSE THIRD_PARTY_NOTICES.md
          sha256sum "$archive" > "$archive.sha256"
          ls -l "$archive"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spark-${{ matrix.name }}
          path: |
            spark-${{ matrix.name }}.tar.gz
            spark-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  smoke:
    needs: build
    name: Run ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          # An x86_64 Linux kernel runs 32-bit static binaries.
          - name: linux-x86
            runner: ubuntu-latest
          - name: macos-aarch64
            runner: macos-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spark-${{ matrix.name }}

      - name: Check the checksum and run the binary
        run: |
          set -euo pipefail
          archive="spark-${{ matrix.name }}.tar.gz"
          if command -v sha256sum >/dev/null; then sha256sum -c "$archive.sha256"; else shasum -a 256 -c "$archive.sha256"; fi
          tar -xzf "$archive"
          ./spark --version
          ./spark help >/dev/null

  publish:
    needs: [check-version, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Write latest.txt and the release notes
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAG" > dist/latest.txt
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > notes.md
          if [ "$(grep -c . notes.md)" -lt 1 ]; then
            printf 'spark %s\n' "$TAG" > notes.md
          fi
          cat >> notes.md <<EOF

          ### Install

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh
          \`\`\`

          Already installed? Run \`spark update\`, or \`/update\` inside spark.
          EOF
          ls -l dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "spark $TAG" \
            --notes-file notes.md \
            --latest \
            dist/spark-*.tar.gz dist/spark-*.tar.gz.sha256 dist/latest.txt
